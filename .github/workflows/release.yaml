name: Prepare library release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version already recorded in pyproject.toml, without v"
        required: true
        type: string
      notes:
        description: "Short user-facing release notes, including compatibility warnings"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: library-release
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest -q

  draft:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - name: Validate release version and notes
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("Use a stable SemVer version such as 0.4.0, without v")
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if version != project["version"]:
              raise SystemExit("Requested version differs from pyproject.toml")
          tags = subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
          if f"v{version}" in tags:
              raise SystemExit("Version tag already exists; choose a new version")
          if not os.environ["RELEASE_NOTES"].strip():
              raise SystemExit("Provide user-facing release notes")
          Path("release-notes.txt").write_text(os.environ["RELEASE_NOTES"] + "\n")
          PY
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/fingerprint-wheel-check
          /tmp/fingerprint-wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/fingerprint-wheel-check/bin/python -c \
            "from audio_fingerprint import fingerprint, WindowSampler; from audio_fingerprint.codec import encode_document, decode_document"
      - name: Create checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - name: Create draft GitHub release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --target "$GITHUB_SHA" \
            --title "v${RELEASE_VERSION}" \
            --notes-file release-notes.txt \
            --draft \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS
